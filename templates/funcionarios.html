{% extends 'base.html' %}{% set page_title='Funcionários' %}{% block content %}<div class="panel"><h2>Novo funcionário</h2><form method="post" class="form-grid"><input name="nome" placeholder="Nome" required><input name="cpf" placeholder="CPF"><input name="cargo" placeholder="Cargo"><input name="setor" placeholder="Setor"><input name="telefone" placeholder="Telefone"><input name="email" placeholder="Email"><select name="status"><option>Ativo</option><option>Inativo</option></select><button class="btn primary">Salvar</button></form></div><div class="panel"><div class="toolbar"><h2>Funcionários</h2><div><a class="btn" href="{{ url_for('exportar', modelo='funcionarios', tipo='excel') }}">Excel</a><a class="btn" href="{{ url_for('exportar', modelo='funcionarios', tipo='pdf') }}">PDF</a></div></div><table><tr><th>Nome</th><th>Cargo</th><th>Setor</th><th>Telefone</th><th>Status</th></tr>{% for f in dados %}<tr><td>{{ f.nome }}</td><td>{{ f.cargo }}</td><td>{{ f.setor }}</td><td>{{ f.telefone }}</td><td>{{ f.status }}</td></tr>{% endfor %}</table></div>{% endblock %}
