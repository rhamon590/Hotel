<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservas · Hotel</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b42;font:15px system-ui,sans-serif}header{background:#13263c;color:white;padding:24px max(5vw,20px)}header small{color:#b9cce0}main{max-width:1100px;margin:30px auto;padding:0 20px}a{color:#165c91}h1{font-size:28px;margin:10px 0}h2{font-size:19px}.muted{color:#5e7286}.panel{background:white;border:1px solid #dce4ee;border-radius:16px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600}input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #bdccdc;border-radius:8px;margin-top:7px;background:white}textarea{min-height:110px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}button,.btn{font:inherit;border:0;border-radius:8px;padding:11px 16px;background:#165c91;color:white;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#e7edf4;color:#183a57}.notice{padding:14px;border-radius:8px;background:#e7f2fc;margin:15px 0}.error{background:#ffeded;color:#952323}.money{font-size:24px;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e4ebf2;white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:#60758a}td .btn{padding:8px 12px}.summary{display:flex;gap:30px;flex-wrap:wrap}small{display:block}input:focus,select:focus,textarea:focus{outline:2px solid #418ed1;outline-offset:2px}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:16px}h1{font-size:24px}}
</style></head><body><header><strong>HOTEL · GESTÃO DE RESERVAS</strong><small>Edição e prorrogação de estadias</small></header><main><a href="{{ url_for('reservas') }}">← Voltar às reservas</a>{% for category,message in get_flashed_messages(with_categories=true) %}<div role="status" class="notice {{ 'error' if category=='danger' else '' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
