{% extends 'base.html' %}{% set page_title='Governança / Limpeza' %}{% block content %}<div class="panel"><h2>Registrar limpeza</h2><form method="post" class="form-grid"><select name="quarto_id">{% for q in quartos %}<option value="{{ q.id }}">Quarto {{ q.numero }}</option>{% endfor %}</select><input name="responsavel" placeholder="Responsável"><select name="status"><option>Aguardando</option><option>Em limpeza</option><option>Limpo</option><option>Inspecionado</option></select><textarea name="checklist" placeholder="Checklist"></textarea><textarea name="observacoes" placeholder="Observações"></textarea><button class="btn primary">Salvar</button></form></div><div class="panel"><table><tr><th>Data</th><th>Quarto</th><th>Responsável</th><th>Status</th><th>Obs</th></tr>{% for l in dados %}<tr><td>{{ l.data.strftime('%d/%m/%Y %H:%M') }}</td><td>{{ l.quarto.numero }}</td><td>{{ l.responsavel }}</td><td><span class="badge">{{ l.status }}</span></td><td>{{ l.observacoes }}</td></tr>{% endfor %}</table></div>{% endblock %}
