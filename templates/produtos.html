{% extends 'base.html' %}{% set page_title='Estoque' %}{% block content %}<div class="panel"><h2>Novo produto</h2><form method="post" class="form-grid"><input name="nome" placeholder="Produto" required><input name="categoria" placeholder="Categoria"><input name="estoque" type="number" placeholder="Estoque"><input name="estoque_minimo" type="number" placeholder="Mínimo"><input name="valor" type="number" step="0.01" placeholder="Valor"><button class="btn primary">Salvar</button></form></div><div class="panel"><div class="toolbar"><h2>Produtos</h2><div><a class="btn" href="{{ url_for('exportar', modelo='produtos', tipo='excel') }}">Excel</a><a class="btn" href="{{ url_for('exportar', modelo='produtos', tipo='pdf') }}">PDF</a></div></div><form action="{{ url_for('importar', modelo='produtos') }}" method="post" enctype="multipart/form-data" class="import"><input type="file" name="arquivo"><button class="btn">Importar Excel</button></form><table><tr><th>Nome</th><th>Categoria</th><th>Estoque</th><th>Mínimo</th><th>Valor</th></tr>{% for p in dados %}<tr><td>{{ p.nome }}</td><td>{{ p.categoria }}</td><td class="{% if p.estoque <= p.estoque_minimo %}dangertext{% endif %}">{{ p.estoque }}</td><td>{{ p.estoque_minimo }}</td><td>R$ {{ '%.2f'|format(p.valor or 0) }}</td></tr>{% endfor %}</table></div>{% endblock %}
